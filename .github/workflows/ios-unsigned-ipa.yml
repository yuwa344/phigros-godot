# .github/workflows/ios-unsigned-ipa.yml
name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_VERSION_DOT: 4.7.2.stable
  IOS_PRESET: iOS

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode / SDK info
        run: |
          echo "=== xcode-select -p ==="
          xcode-select -p
          echo "=== xcodebuild -version ==="
          xcodebuild -version
          echo "=== Available SDKs ==="
          xcodebuild -showsdks || true
          echo "=== iPhoneOS SDK version ==="
          xcodebuild -sdk iphoneos -version SDKVersion 2>/dev/null || true

      - name: Install Godot + export templates
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}

          echo "=== Download Godot ==="
          curl -fL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}_macos.universal.zip"
          file godot.zip

          echo "=== Unzip Godot ==="
          unzip -q godot.zip -d godot
          ls -la godot

          GODOT_BIN="$(find "$PWD/godot" -type f -name Godot -path '*/Contents/MacOS/*' | head -1)"
          if [ -z "$GODOT_BIN" ]; then
            echo "ERROR: Godot executable not found under godot/"
            exit 1
          fi
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> $GITHUB_ENV
          "$GODOT_BIN" --version

          echo "=== Download export templates ==="
          curl -fL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}_export_templates.tpz"
          file templates.tpz

          echo "=== Unzip templates ==="
          unzip -q templates.tpz -d tpl
          ls -la tpl

          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION_DOT}"
          mkdir -p "$TEMPLATE_DIR"
          mv tpl/templates/* "$TEMPLATE_DIR/"
          ls -la "$TEMPLATE_DIR" | head -20

      - name: Prepare iOS export preset
        run: |
          set -euo pipefail
          if [ -f export_presets.cfg ]; then
            cp export_presets.cfg export_presets.cfg.user-backup
          fi
          {
            echo '[preset.0]'
            echo ''
            echo 'name="iOS"'
            echo 'platform="iOS"'
            echo 'runnable=true'
            echo 'dedicated_server=false'
            echo 'custom_features=""'
            echo 'export_filter="all_resources"'
            echo 'include_filter=""'
            echo 'exclude_filter=""'
            echo 'export_path="build/ios_xcode"'
            echo 'encryption_include_filters=""'
            echo 'encryption_exclude_filters=""'
            echo 'seed=0'
            echo 'encrypt_pck=false'
            echo 'encrypt_directory=false'
            echo ''
            echo '[preset.0.options]'
            echo ''
            echo 'custom_template/debug=""'
            echo 'custom_template/release=""'
            echo 'architectures/arm64=true'
            echo 'application/app_store_team_id="ABCDE12345"'
            echo 'application/code_sign_identity_debug=""'
            echo 'application/export_method_debug=1'
            echo 'application/code_sign_identity_release=""'
            echo 'application/export_method_release=0'
            echo 'application/targeted_device_family=1'
            echo 'application/bundle_identifier="com.example.unsigned"'
            echo 'application/signature=""'
            echo 'application/short_version="1.0"'
            echo 'application/version="1.0"'
            echo 'application/name="PhigrosGodot"'
            echo 'application/info=""'
            echo 'application/icon_interpolation=0'
            echo 'application/launch_screens_interpolation=0'
            echo 'application/export_project_only=true'
            echo 'application/delete_old_export_files_unconditionally=true'
            echo 'capabilities/access_wifi=false'
            echo 'capabilities/push_notifications=false'
            echo 'capabilities/performance_gaming_tier=false'
            echo 'capabilities/performance_a12=false'
          } > export_presets.cfg
          cat export_presets.cfg

      - name: Import assets
        run: |
          "$GODOT_BIN" --headless --path . --import || true

      - name: Export iOS Xcode project
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-release "$IOS_PRESET" build/ios_xcode
          echo "=== build/ contents ==="
          ls -la build/

      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          cd build

          echo "=== build/ contents ==="
          ls -la

          PROJ_PATH=$(find . -maxdepth 1 -name "*.xcodeproj" -type d | head -1)
          if [ -z "$PROJ_PATH" ]; then
            echo "ERROR: no .xcodeproj found in build/"
            exit 1
          fi
          PROJ=$(basename "$PROJ_PATH")
          SCHEME=$(basename "$PROJ" .xcodeproj)
          echo "PROJ=$PROJ  SCHEME=$SCHEME"

          set +e
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath dd build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""
          XC_STATUS=$?
          set -e

          if [ "$XC_STATUS" -ne 0 ]; then
            echo "=== xcodebuild FAILED with status $XC_STATUS ==="
            echo "=== Dump SDK version used ==="
            xcodebuild -version || true
            xcodebuild -showsdks || true
            echo "=== Look for .app anyway (may have partially built) ==="
            find . -name "*.app" 2>/dev/null || true
            exit $XC_STATUS
          fi

          APP=$(find dd/Build/Products/Release-iphoneos -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: .app not found"
            find dd/Build/Products -maxdepth 3 -type d | head -40
            exit 1
          fi
          echo "APP=$APP"

          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry PhigrosGodot-unsigned.ipa Payload
          ls -la PhigrosGodot-unsigned.ipa

          mv PhigrosGodot-unsigned.ipa "$GITHUB_WORKSPACE/PhigrosGodot-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PhigrosGodot-unsigned-ipa
          path: PhigrosGodot-unsigned.ipa
          if-no-files-found: error