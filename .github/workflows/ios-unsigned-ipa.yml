# .github/workflows/ios-unsigned-ipa.yml
name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_VERSION_DOT: 4.7.2.stable
  IOS_PRESET: iOS

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot + export templates
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}

          echo "=== Download Godot ==="
          curl -fL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}_macos.universal.zip"
          file godot.zip

          echo "=== Unzip Godot ==="
          unzip -q godot.zip -d godot
          echo "--- top level ---"; ls -la godot
          echo "--- Godot.app ---";   ls -la godot/Godot.app/Contents/MacOS/ || true

          GODOT_BIN="$(find "$PWD/godot" -type f -name Godot -path '*/Contents/MacOS/*' | head -1)"
          if [ -z "$GODOT_BIN" ]; then
            echo "ERROR: Godot executable not found under godot/"; exit 1
          fi
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> $GITHUB_ENV
          "$GODOT_BIN" --version

          echo "=== Download export templates ==="
          curl -fL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}_export_templates.tpz"
          file templates.tpz

          echo "=== Unzip templates ==="
          unzip -q templates.tpz -d tpl
          echo "--- tpl contents ---"; ls -la tpl
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION_DOT}"
          mkdir -p "$TEMPLATE_DIR"
          mv tpl/templates/* "$TEMPLATE_DIR/"
          ls -la "$TEMPLATE_DIR" | head -20

      - name: Generate iOS export preset
        run: |
          if [ ! -f export_presets.cfg ]; then
            printf '%s\n' \
              '[preset.0]' \
              'name="iOS"' \
              'platform="iOS"' \
              'runnable=true' \
              'dedicated_server=false' \
              'custom_features=""' \
              'export_filter="all_resources"' \
              'include_filter=""' \
              'exclude_filter=""' \
              'export_path="build/ios_xcode"' \
              'encryption_include_filters=""' \
              'encryption_exclude_filters=""' \
              'seed=0' \
              'encrypt_pck=false' \
              'encrypt_directory=false' \
              '' \
              '[preset.0.options]' \
              'custom_template/debug=""' \
              'custom_template/release=""' \
              'architectures/arm64=true' \
              'application/app_store_team_id="AAAAABBBBB"' \
              'application/code_sign_identity_debug=""' \
              'application/export_method_debug=1' \
              'application/code_sign_identity_release=""' \
              'application/export_method_release=0' \
              'application/targeted_device_family=1' \
              'application/bundle_identifier="com.example.unsigned"' \
              'application/signature=""' \
              'application/short_version="1.0"' \
              'application/version="1.0"' \
              'application/name="PhigrosGodot"' \
              'application/info=""' \
              'application/icon_interpolation=0' \
              'application/launch_screens_interpolation=0' \
              'application/export_project_only=true' \
              'application/delete_old_export_files_unconditionally=true' \
              'capabilities/access_wifi=false' \
              'capabilities/push_notifications=false' \
              'capabilities/performance_gaming_tier=false' \
              'capabilities/performance_a12=false' \
              > export_presets.cfg
          fi
          cat export_presets.cfg

      - name: Import assets
        run: '"$GODOT_BIN" --headless --path . --import || true'

      - name: Export iOS Xcode project
        run: |
          rm -rf build/ios_xcode
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-release "$IOS_PRESET" build/ios_xcode

      - name: Build unsigned IPA
        run: |
          cd build/ios_xcode
          PROJ=$(ls *.xcodeproj | head -1)
          SCHEME=$(basename "$PROJ" .xcodeproj)
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -derivedDataPath dd build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""
          APP=$(find dd/Build/Products/Release-iphoneos -name "*.app" | head -1)
          if [ -z "$APP" ]; then echo "ERROR: .app not found"; exit 1; fi
          echo "APP=$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry PhigrosGodot-unsigned.ipa Payload
          cd ../..

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PhigrosGodot-unsigned-ipa
          path: build/ios_xcode/PhigrosGodot-unsigned.ipa